name: Validate STUN port migration 0.2.39

on:
  push:
    branches:
      - fix/stun-port-migration-0239-20260902

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install --disable-pip-version-check -r requirements.txt pytest

      - name: Apply patch
        run: python3 tools/_fix_stun_port_migration_20260902.py

      - name: Validate Hub and Relay
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python -m py_compile stun_port_config_patch.py hub_entry.py labrelay_sync_patch.py
          python -m pytest -q tests/test_stun_middle_port_wiring.py
          cargo test --manifest-path labrelay/Cargo.toml --all-targets

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ChatGPT"
          git config user.email "actions@users.noreply.github.com"
          git add stun_port_config_patch.py tests/test_stun_middle_port_wiring.py labrelay/Cargo.toml labrelay/Cargo.lock .github/workflows/ci.yml
          git commit -m "fix(stun): migrate legacy middle ports and bump relay 0.2.39"
          git push origin HEAD:fix/stun-port-migration-0239-20260902
