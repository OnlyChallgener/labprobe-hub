name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - refactor/router-core-v1
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - refactor/router-core-v1

concurrency:
  group: hub-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      APP_TOKEN: ci-app-token
      HOOK_TOKEN: ci-hook-token
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install --disable-pip-version-check -r requirements.txt pytest

      - name: Compile Hub sources
        run: |
          python -m py_compile             hub.py hub_entry.py hub_realtime_ws.py hub0934_fixes.py hub0935_sync_fix.py             final_stability_patch.py followup_stability_patch.py             device_history_patch.py portmap_persistence_patch.py agent_presence_patch.py             router_task_manager_patch.py router_config_sync_patch.py stun_service.py             wireguard_service.py             router_device_live_sync_patch.py router_lite_realtime_patch.py             labrelay_sync_patch.py router/firewall_automation.py             router_compat.py router_core/errors.py             router_core/driver/reyee_session.py router_core/driver/reyee_rpc.py             router_core/driver/reyee.py router_core/cache/router_cache.py             router_core/realtime/router_realtime.py router_core/service/router_service.py             router_core/service/blueprint.py

      - name: Run Hub tests
        run: python -m pytest -q

      - name: Verify release versions
        run: |
          set -e
          grep -q 'HUB_VERSION = "0.11.6"' hub_entry.py
          grep -q 'create_router_blueprint_v1' hub_entry.py
          grep -q 'install_hub0934_fixes(hub)' hub_entry.py
          grep -q 'install_hub0935_device_sync_fix(hub)' hub_entry.py
