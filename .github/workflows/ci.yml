name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - refactor/router-core-v1
      - codex/child-internet
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - refactor/router-core-v1
      - codex/child-internet

concurrency:
  group: hub-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      APP_TOKEN: ci-app-token
      HOOK_TOKEN: ci-hook-token
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install --disable-pip-version-check -r requirements.txt pytest

      - name: Compile Hub sources
        # Compile everything that ships instead of a hand-written list.  The old
        # list was missing child_guard_service.py, which is how a module that
        # hub.py imports at module scope reached production uncompiled and
        # unverified.
        run: |
          python -m compileall -q hub.py hub_entry.py *.py router router_core assistant
          python scripts/docker_preflight.py .

      - name: Run Hub tests
        run: python -m pytest -q

      - name: Verify release versions
        run: |
          set -e
          grep -q 'HUB_VERSION = "0.13.18"' hub_entry.py
          grep -q 'create_router_blueprint_v1' hub_entry.py
          grep -q 'create_ai_blueprint' hub_entry.py
          grep -q 'install_hub0934_fixes(hub)' hub_entry.py
          grep -q 'install_hub0935_device_sync_fix(hub)' hub_entry.py
          grep -q 'labrelay_hook' hub0935_sync_fix.py
          grep -q 'liveRouterPollPersistence' hub0935_sync_fix.py
          grep -q '_run_router_connection_without_app_keepalive' hub0935_sync_fix.py
          ! grep -q 'target=self._keepalive_loop' hub0935_sync_fix.py
          grep -q 'canonical_watched_devices' hub0934_fixes.py
          grep -q '_normalize_portmap_payload' hub0934_fixes.py
          grep -q 'install_router_device_live_sync_patch' hub_entry.py
          grep -q '/api/realtime/ws' hub_realtime_ws.py
          test ! -e assistant/wechat.py
          # Guards against the removed OpenClaw / WeChat bridge reappearing in
          # shipped Hub code or docs.  Test fixtures are excluded on purpose:
          # the child-guard allowlist mirrors the router's own RDPI app ids, and
          # "wechat" is the identifier the firmware reports for 微信.  Naming it
          # in a fixture is not the bridge coming back.
          ! git grep -qi -E 'wechat|clawbot|openclaw' -- '*.py' '*.md' '*.env*' 'Dockerfile' ':(exclude)tests/**'
          # LabRelay's version is whatever Cargo.toml declares, and Cargo.lock
          # must agree with it. Do NOT hardcode the number here: a stale literal
          # turns every version bump into a red build across all branches (the
          # old `version = "0.2.48"` grep did exactly that from 0.2.49 onward).
          python - <<'PY'
          import re
          from pathlib import Path
          version = re.search(
              r'^version = "([^"]+)"',
              Path('labrelay/Cargo.toml').read_text(encoding='utf-8'),
              re.M,
          ).group(1)
          lock = Path('labrelay/Cargo.lock').read_text(encoding='utf-8')
          match = re.search(
              r'\[\[package\]\]\nname = "labrelay"\nversion = "([^"]+)"', lock
          )
          assert match, 'labrelay package missing from Cargo.lock'
          assert match.group(1) == version, (
              f'Cargo.lock {match.group(1)} != Cargo.toml {version}'
          )
          print(f'LabRelay {version} consistent across Cargo.toml and Cargo.lock')
          PY
          grep -q 'PORTMAP_PORT_MAX = 29999' labrelay_sync_patch.py
          grep -q 'STUN_LOCAL_PORT_MIN = 30000' labrelay_sync_patch.py
          grep -q 'STUN_LOCAL_PORT_MAX = 32767' labrelay_sync_patch.py
          sh -n agent/install.sh
          sh -n scripts/labprobe-install.sh
          grep -q 'procd_set_param limits nofile="131072 131072"' agent/install.sh
          grep -q "ulimit -n 131072; exec /usr/bin/labrelay daemon" agent/install.sh
          grep -q -- '--port-max 32767' agent/install.sh
          grep -q 'procd_set_param limits nofile="131072 131072"' scripts/labprobe-install.sh
          grep -q -- '--port-max 32767' scripts/labprobe-install.sh

      - name: Test and build LabRelay
        working-directory: labrelay
        run: |
          cargo test --all-targets
          cargo build --release

      - name: Build Hub Docker image
        # Building the image and importing the entry point from inside it is the
        # check that proves the image is self-contained.  It is deliberately run
        # against the built image, not the working tree.
        run: |
          docker build --pull=false -t labprobe-hub:v0.13.18 .
          docker run --rm --entrypoint python labprobe-hub:v0.13.18 -c \
            'import hub_entry, child_guard_service, assistant, router_core, hub0934_fixes, hub0935_sync_fix, labrelay_sync_patch; print("Hub 0.13.18 imports OK")'
