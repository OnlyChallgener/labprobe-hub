name: Docker Image

on:
  push:
    branches:
      - main
      - refactor/router-core-v1
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test Hub runtime
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
          python -m py_compile             hub.py hub_entry.py hub_realtime_ws.py             hub0934_fixes.py hub0935_sync_fix.py             final_stability_patch.py followup_stability_patch.py             agent_presence_patch.py device_history_patch.py portmap_persistence_patch.py             labrelay_sync_patch.py lab_ddns.py lab_ddns_providers.py             labprobe_storage.py             router_compat.py router_core/errors.py             router_core/driver/reyee_session.py router_core/driver/reyee_rpc.py             router_core/driver/reyee.py router_core/cache/router_cache.py             router_core/realtime/router_realtime.py router_core/service/router_service.py             router_core/service/blueprint.py
          python -m pytest -q

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Hub
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/labprobe-hub:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/labprobe-hub:0.11.1-rc1
            ${{ secrets.DOCKERHUB_USERNAME }}/labprobe-hub:v0.11.1-rc1
