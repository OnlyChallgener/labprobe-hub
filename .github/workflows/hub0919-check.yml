name: Hub 0921 Control Actor Check

on:
  push:
    branches:
      - hub0921
  workflow_dispatch:

concurrency:
  group: hub0921-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  statuses: write

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish pending status
        uses: actions/github-script@v7
        with:
          script: |
            const target_url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: 'labprobe/hub0921-stage',
              description: 'Hub 0.9.27 control actor checks are running',
              target_url
            })

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Compile Hub runtime
        run: |
          python -m py_compile hub.py hub_entry.py router_rpc.py router_rpc_v099.py router_rpc_v010.py router_native_features_patch.py router_slow_cache_patch.py router_control_scheduler_patch.py router_control_actor_patch.py hub_realtime_ws.py

      - name: Verify Hub version and runtime wiring
        run: |
          grep -F 'HUB_VERSION = "0.9.27"' hub_entry.py
          grep -F 'install_router_control_scheduler_patch()' hub_entry.py
          grep -F 'install_router_control_actor_patch()' hub_entry.py
          grep -F 'router_control_actor_patch.py' Dockerfile
          grep -F 'PRIORITY_COMMAND = 10' router_control_actor_patch.py
          grep -F 'PRIORITY_BACKGROUND = 50' router_control_actor_patch.py
          grep -F 'BACKGROUND_DEFERRED' router_control_actor_patch.py
          grep -F 'NAT_MAX_RUNTIME_SECONDS' router_native_features_patch.py
          grep -F 'BETA_CACHE_TTL_SECONDS' router_native_features_patch.py
          ! grep -F 'natDiagnosticCancel"] = True' router_native_features_patch.py

      - name: Test router cache, actor, scheduling and NAT helpers
        run: |
          set -o pipefail
          python -m pytest -q tests/test_router_slow_cache_patch.py tests/test_router_control_scheduler_patch.py tests/test_router_control_actor_patch.py tests/test_router_native_nat_helpers.py tests/test_router_native_features_patch.py 2>&1 | tee /tmp/hub0921-pytest.log

      - name: Build runtime image
        run: docker build -t labprobe-hub:0.9.27-test . 2>&1 | tee /tmp/hub0921-docker.log

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Hub-0.9.27-diagnostics
          path: |
            /tmp/hub0921-pytest.log
            /tmp/hub0921-docker.log
          if-no-files-found: ignore

      - name: Publish final status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const state = '${{ job.status }}' === 'success' ? 'success' : 'failure'
            const target_url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              context: 'labprobe/hub0921-stage',
              description: state === 'success' ? 'Hub 0.9.27 control actor checks passed' : 'Hub 0.9.27 checks failed',
              target_url
            })
