name: Hub 0920 Check

on:
  push:
    branches:
      - hub0920
  workflow_dispatch:

concurrency:
  group: hub0920-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Compile Hub runtime
        run: |
          python -m py_compile hub.py hub_entry.py router_rpc.py router_rpc_v099.py router_rpc_v010.py router_native_features_patch.py router_slow_cache_patch.py router_control_scheduler_patch.py hub_realtime_ws.py

      - name: Verify Hub version and runtime wiring
        run: |
          grep -F 'HUB_VERSION = "0.9.26"' hub_entry.py
          grep -F 'install_router_control_scheduler_patch()' hub_entry.py
          grep -F 'router_control_scheduler_patch.py' Dockerfile
          grep -F 'NAT_MAX_RUNTIME_SECONDS' router_native_features_patch.py
          grep -F 'BETA_CACHE_TTL_SECONDS' router_native_features_patch.py
          ! grep -F 'natDiagnosticCancel"] = True' router_native_features_patch.py

      - name: Test router cache, scheduling and NAT helpers
        run: |
          python -m pytest -q tests/test_router_slow_cache_patch.py tests/test_router_control_scheduler_patch.py tests/test_router_native_nat_helpers.py tests/test_router_native_features_patch.py

      - name: Build runtime image
        run: docker build -t labprobe-hub:0.9.26-test .
