name: Hub0923 Stage

on:
  push:
    branches: [hub0923]
  pull_request:
    branches: [hub0922]
  workflow_dispatch:

concurrency:
  group: hub0923-stage-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: pip install --disable-pip-version-check -r requirements.txt pytest
      - name: Compile Hub sources
        run: |
          python -m py_compile \
            hub.py hub_entry.py hub_realtime_ws.py \
            device_history_patch.py portmap_persistence_patch.py \
            agent_presence_patch.py router_task_manager_patch.py \
            router_config_sync_patch.py router_lite_realtime_patch.py
      - name: Run existing Hub tests
        run: python -m pytest -q
      - name: Verify durable history and mapping invariants
        env:
          APP_TOKEN: ci-app-token
          HOOK_TOKEN: ci-hook-token
        run: |
          set -e
          grep -q 'HUB_VERSION = "0.9.29"' hub_entry.py
          grep -q 'install_device_history_patch(hub)' hub_entry.py
          grep -q 'install_portmap_persistence_patch(hub)' hub_entry.py
          grep -q 'DURABLE_SNAPSHOT_INTERVAL.*60' labrelay/src/runtime.rs
          grep -q '/api/router/devices/snapshot' labrelay/src/runtime.rs
          grep -q 'version = "0.2.12"' labrelay/Cargo.toml
          python - <<'PY'
          import os
          import tempfile
          from datetime import datetime
          from pathlib import Path

          root = tempfile.TemporaryDirectory()
          base = Path(root.name)
          os.environ['DATA_DIR'] = str(base / 'data')
          os.environ['CONFIG_DIR'] = str(base / 'config')
          os.environ['BACKUPS_DIR'] = str(base / 'backups')
          os.environ['LOGS_DIR'] = str(base / 'logs')
          os.environ['DATABASE_PATH'] = str(base / 'data' / 'labprobe.db')
          os.environ['CONFIG_PATH'] = str(base / 'config' / 'config.yaml')

          import hub
          from device_history_patch import install_device_history_patch
          from portmap_persistence_patch import install_portmap_persistence_patch

          service = install_device_history_patch(hub)
          stamp = datetime.now().strftime('%Y-%m-%d 00:00:01')
          first = {
              'total': 1,
              'list': [{
                  'mac': 'AA-BB-CC-DD-EE-FF',
                  'devRecommend': '测试终端',
                  'userIp': '192.168.5.20',
                  'onlinetime': stamp,
                  'activeTime': 60,
                  'dailyUp': 1024,
                  'dailyDown': 2048,
                  'connectType': 'wireless',
              }],
          }
          result = service.ingest(first)
          assert result['accepted'] is True, result
          devices = hub.load_json(hub.DEVICES_FILE, {})
          assert devices['online'][0]['name'] == '测试终端'
          assert devices['online'][0]['todayUpload'] == 1024
          assert devices['online'][0]['todayOnlineDurationSec'] >= 0

          second = {'total': 1, 'list': [{**first['list'][0], 'dailyUp': 3072, 'dailyDown': 8192, 'activeTime': 120}]}
          service.ingest(second)
          daily = hub.aggregate_daily(hub.today_str())
          rows = daily.get('sections', {}).get('devices', [])
          assert rows and rows[0]['todayUpload'] >= 3072, daily
          assert rows[0]['todayDownload'] >= 8192, daily
          assert daily['summary']['hasDurableDeviceSnapshot'] is True

          deferred = service.ingest({'total': 0, 'list': []})
          assert deferred.get('deferredEmpty') is True, deferred
          still_present = hub.load_json(hub.DEVICES_FILE, {})
          assert len(still_present.get('online', [])) == 1

          install_portmap_persistence_patch(hub)
          hub._save_portmap_rules([{
              'id': 'rule-1', 'name': '测试映射', 'enabled': True,
              'mode': '6to4', 'listenPort': 20001, 'targetMode': 'ipv4',
              'targetIpv4': '192.168.5.20', 'targetIpv6': '',
              'targetIpv6Suffix': '', 'targetMac': '', 'targetPort': 443,
              'preferCurrentPrefix': True, 'expiresAt': None, 'leaseSeconds': 0,
              'maxConnections': 32, 'idleTimeoutSec': 300,
              'createdAt': hub.now_str(), 'updatedAt': hub.now_str(),
          }])
          client = hub.app.test_client()
          response = client.get('/api/portmaps', headers={'Authorization': 'Bearer ci-app-token'})
          assert response.status_code == 200, response.data
          body = response.get_json()
          assert body['rulesLoaded'] is True, body
          assert body['rulesRevision'] >= 1, body
          assert len(body['rules']) == 1, body
          assert body['agentOnline'] is False, body
          print('durable device history, daily summary and offline Agent mapping persistence verified')
          PY
      - name: Test and build LabRelay
        working-directory: labrelay
        run: |
          cargo test --all-targets
          cargo build --release
      - name: Build Docker image
        run: docker build --pull=false -t labprobe-hub:hub0923 .
