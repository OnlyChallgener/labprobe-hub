name: One-shot configured NAS MAC helper fix retry

on:
  push:
    branches:
      - fix/configured-nas-macs-nameerror
    paths:
      - .github/workflows/one-shot-configured-nas-macs-fix-retry.yml

permissions:
  contents: write

jobs:
  patch-validate-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/configured-nas-macs-nameerror
          fetch-depth: 0

      - name: Restore missing helper
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('hub.py')
          text = path.read_text(encoding='utf-8')
          if 'def configured_nas_macs()' in text:
              raise SystemExit('configured_nas_macs already exists; refusing duplicate patch')

          marker = '\ndef attach_hub_local_ipv6_to_nas_devices(devices: List[Dict[str, Any]]) -> List[Dict[str, Any]]:'
          if marker not in text:
              raise SystemExit('attach_hub_local_ipv6_to_nas_devices marker not found')

          helper = r'''


def configured_nas_macs() -> set:
    vals: List[str] = []
    env_raw = host_mac()
    if env_raw:
        vals.extend(re.split(r"[\s,;]+", env_raw))
    for key in ["nas.mac", "nas.macs", "nas.device_mac"]:
        raw = cfg_get(key, None)
        if isinstance(raw, list):
            vals.extend(str(x) for x in raw)
        elif raw:
            vals.extend(re.split(r"[\s,;]+", str(raw)))

    return {norm_mac(x) for x in vals if norm_mac(x)}
'''
          path.write_text(text.replace(marker, helper + marker, 1), encoding='utf-8')
          PY

      - name: Validate Python and missing-name regression
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile hub.py
          python3 - <<'PY'
          import ast
          from pathlib import Path

          tree = ast.parse(Path('hub.py').read_text(encoding='utf-8'))
          definitions = {node.name for node in tree.body if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))}
          calls = [node for node in ast.walk(tree) if isinstance(node, ast.Call) and isinstance(node.func, ast.Name) and node.func.id == 'configured_nas_macs']
          assert 'configured_nas_macs' in definitions
          assert calls
          PY
          git diff --check

      - name: Commit focused fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hub.py
          test -n "$(git diff --cached --name-only)"
          git commit -m "fix(hub): restore configured NAS MAC helper"
          git push origin HEAD:fix/configured-nas-macs-nameerror
