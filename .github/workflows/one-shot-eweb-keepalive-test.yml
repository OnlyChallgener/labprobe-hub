name: One-shot eWeb keepalive test 20260902

on:
  push:
    branches:
      - fix/hub-push-installer-upgrade
    paths:
      - .github/workflows/one-shot-eweb-keepalive-test.yml

permissions:
  contents: write

jobs:
  patch-test-publish:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
      TEST_TAG: test-bundle/20260902-eweb-keepalive
      TEST_IMAGE_TAG: test-20260902-eweb-keepalive

    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/hub-push-installer-upgrade
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Patch eWeb websocket keepalive
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('router_ws_patch.py')
          text = path.read_text(encoding='utf-8')

          if 'ROUTER_WS_KEEPALIVE_SECONDS' not in text:
              anchor = 'FAST_SOCKET_POLL_SECONDS = 1.0\nMAX_ROUTER_RETRY_SECONDS = 2.0\n'
              replacement = 'FAST_SOCKET_POLL_SECONDS = 1.0\nROUTER_WS_KEEPALIVE_SECONDS = 5.0\nMAX_ROUTER_RETRY_SECONDS = 2.0\n'
              if anchor not in text:
                  raise SystemExit('router websocket constants anchor not found')
              text = text.replace(anchor, replacement, 1)

          old_wait = '        while not self._stop.wait(10.0) and not stop.is_set():\n'
          new_wait = '        while not self._stop.is_set() and not stop.wait(ROUTER_WS_KEEPALIVE_SECONDS):\n'
          if new_wait not in text:
              if old_wait not in text:
                  raise SystemExit('router websocket keepalive wait anchor not found')
              text = text.replace(old_wait, new_wait, 1)

          start_old = '        connected_at = time.time()\n        self._set_connected(True, ws_url)\n        try:\n'
          start_new = (
              '        connected_at = time.time()\n'
              '        self._set_connected(True, ws_url)\n'
              '        keepalive_stop = threading.Event()\n'
              '        keepalive_thread = threading.Thread(\n'
              '            target=self._keepalive_loop,\n'
              '            args=(ws, keepalive_stop),\n'
              '            name="router-eweb-ws-keepalive",\n'
              '            daemon=True,\n'
              '        )\n'
              '        keepalive_thread.start()\n'
              '        try:\n'
          )
          if start_new not in text:
              if start_old not in text:
                  raise SystemExit('router websocket connection-start anchor not found')
              text = text.replace(start_old, start_new, 1)

          finish_old = (
              '        finally:\n'
              '            try:\n'
              '                ws.close()\n'
              '            except Exception:\n'
              '                pass\n'
              '\n'
              '    def _loop(self) -> None:\n'
          )
          finish_new = (
              '        finally:\n'
              '            keepalive_stop.set()\n'
              '            try:\n'
              '                ws.close()\n'
              '            except Exception:\n'
              '                pass\n'
              '            keepalive_thread.join(timeout=1.0)\n'
              '\n'
              '    def _loop(self) -> None:\n'
          )
          if finish_new not in text:
              if finish_old not in text:
                  raise SystemExit('router websocket connection-finally anchor not found')
              text = text.replace(finish_old, finish_new, 1)

          path.write_text(text, encoding='utf-8')
          PY
          git diff --check

      - name: Test Hub websocket fix
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
          python -m py_compile router_ws_patch.py hub_entry.py
          python -m pytest -q
          python3 - <<'PY'
          import json
          import logging
          import threading
          from unittest.mock import patch

          import router_ws_patch
          from router_ws_patch import RouterWebSocketMonitor

          assert 0 < router_ws_patch.ROUTER_WS_KEEPALIVE_SECONDS < 10.0
          sent = []
          keepalive_sent = threading.Event()

          class FakeSocket:
              def __init__(self):
                  self.closed = False
              def settimeout(self, _value):
                  return None
              def recv(self):
                  if keepalive_sent.wait(0.5):
                      return ''
                  raise AssertionError('keepalive was not sent while websocket recv was idle')
              def send(self, payload):
                  sent.append(json.loads(payload))
                  keepalive_sent.set()
              def close(self):
                  self.closed = True

          fake_socket = FakeSocket()
          monitor = object.__new__(RouterWebSocketMonitor)
          monitor.logger = logging.getLogger('router-ws-keepalive-smoke')
          monitor._lock = threading.RLock()
          monitor._stop = threading.Event()
          monitor._last_fast_at = 0.0
          monitor._connected = False
          monitor._url = ''
          monitor._last_error = ''
          monitor._connected_at = 0.0

          old_interval = router_ws_patch.ROUTER_WS_KEEPALIVE_SECONDS
          router_ws_patch.ROUTER_WS_KEEPALIVE_SECONDS = 0.01
          try:
              with patch.object(router_ws_patch.websocket, 'create_connection', return_value=fake_socket):
                  try:
                      monitor._run_connection('ws://router/ws?auth=test', 'http://router', 'sid=test', False, 'router')
                  except RuntimeError as exc:
                      assert 'router websocket closed' in str(exc)
                  else:
                      raise AssertionError('connection did not exit after fake socket closed')
          finally:
              router_ws_patch.ROUTER_WS_KEEPALIVE_SECONDS = old_interval

          assert sent and sent[0] == {'action': 'keepalive'}
          assert fake_socket.closed
          PY

      - name: Commit fix and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-eweb-keepalive-test.yml
          git add router_ws_patch.py
          git diff --cached --check
          git commit -m "fix(router-ws): keep eWeb websocket alive"
          git push origin HEAD:fix/hub-push-installer-upgrade

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Hub test image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/labprobe-hub:${{ env.TEST_IMAGE_TAG }}

      - name: Publish Hub test prerelease note
        env:
          GH_TOKEN: ${{ github.token }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        shell: bash
        run: |
          set -euo pipefail
          FIX_SHA="$(git rev-parse HEAD)"
          NOTES="Hub eWeb /ws keepalive test build.\n\nFix: start a 5-second keepalive sender for each authenticated router websocket connection; stop it with the connection; retain the existing fast-stream stall watchdog and auth recovery.\n\nHub image: ${DOCKERHUB_USERNAME}/labprobe-hub:${TEST_IMAGE_TAG}\nHub commit: ${FIX_SHA}\nRelay: unchanged."
          if gh release view "$TEST_TAG" >/dev/null 2>&1; then
            gh release edit "$TEST_TAG" --title "eWeb keepalive test ${TEST_TAG}" --notes "$NOTES" --prerelease
          else
            gh release create "$TEST_TAG" --target "$FIX_SHA" --title "eWeb keepalive test ${TEST_TAG}" --notes "$NOTES" --prerelease
          fi
