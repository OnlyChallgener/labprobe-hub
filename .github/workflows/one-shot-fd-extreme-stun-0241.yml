name: One-shot Relay 0.2.41 patch

on:
  push:
    branches:
      - fix/relay-nofile-upgrade-0.2.33-v2
    paths:
      - .github/workflows/one-shot-fd-extreme-stun-0241.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/relay-nofile-upgrade-0.2.33-v2
          fetch-depth: 0

      - name: Apply focused source patch
        run: python3 scripts/one_shot_fd_extreme_stun_0241.py

      - name: Test Rust
        run: cargo test --manifest-path labrelay/Cargo.toml --all-targets

      - name: Test Hub contract
        run: |
          python3 -m pip install -q -r requirements.txt pytest
          python3 -m pytest -q tests/test_tcp_session_service.py tests/test_stun_service.py tests/test_stun_middle_port_wiring.py

      - name: Verify installer
        run: |
          sh -n scripts/labprobe-install.sh
          grep -q 'ulimit -Hn 131072' scripts/labprobe-install.sh
          grep -q 'COPY scripts/labprobe-install.sh /app/agent/install.sh' Dockerfile

      - name: Commit source fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Dockerfile scripts/labprobe-install.sh tcp_session_service.py tests/test_tcp_session_service.py labrelay/Cargo.toml labrelay/Cargo.lock labrelay/src/main.rs labrelay/src/tcp_session_test.rs
          git diff --cached --check
          git commit -m 'fix(relay): restore FD headroom and add extreme mode'
          git push origin HEAD:fix/relay-nofile-upgrade-0.2.33-v2
