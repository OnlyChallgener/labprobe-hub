name: One-shot Hub IPv6 neighbor parser fix

on:
  push:
    branches:
      - fix/hub-push-installer-upgrade
    paths:
      - .github/workflows/one-shot-hub-ipv6-parser-fix.yml

permissions:
  contents: write

jobs:
  patch-validate-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/hub-push-installer-upgrade
          fetch-depth: 0

      - name: Restore IPv6 neighbor parser from stable baseline
        shell: bash
        env:
          HELPER_B64: 
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          path = Path('hub.py')
          text = path.read_text(encoding='utf-8')
          if 'def parse_ipv6_neighbors(' in text:
              raise SystemExit('parse_ipv6_neighbors already exists; refusing duplicate patch')
          marker = '\ndef attach_hub_local_ipv6_to_nas_devices(devices: List[Dict[str, Any]]) -> List[Dict[str, Any]]:'
          if marker not in text:
              raise SystemExit('attach_hub_local_ipv6_to_nas_devices marker not found')
          helper = base64.b64decode(os.environ['HELPER_B64']).decode('utf-8')
          path.write_text(text.replace(marker, helper + marker, 1), encoding='utf-8')
          PY

      - name: Validate syntax and symbol wiring
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile hub.py
          python3 - <<'PY'
          import ast
          from pathlib import Path
          tree = ast.parse(Path('hub.py').read_text(encoding='utf-8'))
          defs = {n.name for n in ast.walk(tree) if isinstance(n, (ast.FunctionDef, ast.AsyncFunctionDef))}
          assert 'parse_ipv6_neighbor_text' in defs
          assert 'parse_ipv6_neighbors' in defs
          calls = [n for n in ast.walk(tree) if isinstance(n, ast.Call) and isinstance(n.func, ast.Name) and n.func.id == 'parse_ipv6_neighbors']
          assert calls, 'api_router_push no longer calls parse_ipv6_neighbors'
          PY
          git diff --check

      - name: Commit focused Hub fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hub.py
          git commit -m "fix(hub): restore IPv6 neighbor parser"
          git push origin HEAD:fix/hub-push-installer-upgrade
