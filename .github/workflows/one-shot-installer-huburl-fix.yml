name: One-shot installer hubUrl extraction fix

on:
  push:
    branches:
      - fix/hub-push-installer-upgrade
    paths:
      - .github/workflows/one-shot-installer-huburl-fix.yml

permissions:
  contents: write

jobs:
  patch-validate-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/hub-push-installer-upgrade
          fetch-depth: 0

      - name: Fix sed backreference
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/labprobe-install.sh')
          data = path.read_bytes()
          needle = b'"\\([^\"]*\\)".*/\x01/p'
          replacement = b'"\\([^\"]*\\)".*/\\1/p'
          if needle not in data:
              raise SystemExit('broken hubUrl sed marker not found')
          path.write_bytes(data.replace(needle, replacement, 1))
          PY

      - name: Validate shell and real hubUrl extraction
        shell: bash
        run: |
          set -euo pipefail
          sh -n scripts/labprobe-install.sh
          ! LC_ALL=C grep -n $'\001' scripts/labprobe-install.sh
          printf '%s\n' '{"hubUrl":"http://192.168.5.46:58443","routerName":"BE72"}' > /tmp/agent.json
          EXTRACTED=$(sed -n 's/.*"hubUrl"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' /tmp/agent.json | head -n1)
          test "$EXTRACTED" = 'http://192.168.5.46:58443'
          git diff --check

      - name: Commit focused extraction fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/labprobe-install.sh
          git commit -m "fix(installer): preserve hubUrl during upgrade"
          git push origin HEAD:fix/hub-push-installer-upgrade
