name: One-shot installer upgrade fix

on:
  push:
    branches:
      - fix/hub-push-installer-upgrade
    paths:
      - .github/workflows/one-shot-installer-upgrade-fix.yml

permissions:
  contents: write

jobs:
  patch-validate-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/hub-push-installer-upgrade
          fetch-depth: 0

      - name: Apply true upgrade and local bundle priority
        shell: bash
        env:
          PATCH_B64: 
        run: |
          python3 - <<'PY'
          import base64, os
          source = base64.b64decode(os.environ["PATCH_B64"]).decode("utf-8")
          namespace = {}
          exec(compile(source, "<installer-upgrade-patch>", "exec"), namespace, namespace)
          PY

      - name: Validate BusyBox-compatible shell and policy
        shell: bash
        run: |
          set -euo pipefail
          sh -n scripts/labprobe-install.sh
          git diff --check
          grep -F 'resolve_local_binary()' scripts/labprobe-install.sh
          grep -F '升级模式：保留现有 Agent 配置，不重新注册' scripts/labprobe-install.sh
          grep -F '未发现可用本地安装包，改用更新仓库' scripts/labprobe-install.sh
          grep -F '安装脚本同目录' scripts/labprobe-install.sh
          grep -F 'if [ "$ACTION" = "upgrade" ]; then' scripts/labprobe-install.sh

      - name: Commit focused installer fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/labprobe-install.sh
          git commit -m "fix(installer): prefer local bundle for true upgrades"
          git push origin HEAD:fix/hub-push-installer-upgrade
