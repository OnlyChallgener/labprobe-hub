name: One-shot installer upgrade fix

on:
  push:
    branches:
      - fix/hub-push-installer-upgrade
    paths:
      - .github/workflows/one-shot-installer-upgrade-fix.yml

permissions:
  contents: write

jobs:
  patch-validate-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/hub-push-installer-upgrade
          fetch-depth: 0

      - name: Apply true upgrade and local bundle priority
        shell: bash
        env:
          PATCH_B64:  dG1wL2xhYnJlbGF5LSRBUkNILW11c2wiIFwKICAgICIv  \KSIuKi9cMS9wJyAiJENPTkZJRyIgfCBoZWFkIC1uMSkiCiAgSFVCX1VSTCI9IiR7SFVCX1VSTDotJFN BVkVEX0hVQl9VUkx9IgogIFsgLW4gIiRIVUJfVVJMIiBdIHx8IGZhaWwgIueOsOacieC Agent p configuration missing hubUrl, unable to perform in-place upgrade"
  case "$HUB_URL" in
    http://*|https://*) ;;
    *) fail "现有 Agent hubUrl 无效：$HUB_URL" ;;
  esac
  # Upgrade is intentionally non-destructive: keep the existing Agent config
  # and only replace the binary/service definition, then run health checks.
  HOOK_TOKEN_INPUT=""
  say "升级模式：保留现有 Agent 配置，不重新注册；Hub=$HUB_URL"
else
  ask_yes "是否安装 LabProbe Rust Agent？[Y/n]" Y || exit 0
  discover_hub
  say "自动发现 Hub：$HUB_URL"
  ask_yes "自动发现的 Hub 是否正确？[Y/n]" Y || fail "已取消；请设置 HUB_URL 后重试"

  if [ "$ACTION" = "install" ] || [ "$ACTION" = "configure" ] || ! grep -q '"hookToken"[[:space:]]*:' "$CONFIG" 2>/dev/null; then
    if [ -z "$HOOK_TOKEN_INPUT" ]; then
      printf "请输入 Hub HOOK_TOKEN："; read HOOK_TOKEN_INPUT || HOOK_TOKEN_INPUT=""
    fi
    [ -n "$HOOK_TOKEN_INPUT" ] || fail "HOOK_TOKEN 不能为空"
  fi

  say "架构=$ARCH，Hub=$HUB_URL，将安装采集、事件、IPv6、端口映射、重试、日志和开机自启"
  ask_yes "确认安装？[Y/n]" Y || exit 0
fi

mkdir -p "$INSTALL_DIR/backups" /tmp/labprobe
'''
if main_start not in text:
    raise SystemExit("main install/upgrade flow marker not found")
text = text.replace(main_start, main_new, 1)

old_prepare = '''backup_old
prune_backups
if [ -n "$LOCAL_BINARY" ]; then
  INSTALL_STAGE="校验本地 ARM64 Agent"
else
  INSTALL_STAGE="下载并校验 ARM64 Agent"
fi
prepare_binary
'''
new_prepare = '''backup_old
prune_backups
resolve_local_binary
if [ -n "$LOCAL_BINARY" ]; then
  INSTALL_STAGE="校验本地 ARM64 Agent"
else
  INSTALL_STAGE="下载并校验 ARM64 Agent"
  say "未发现可用本地安装包，改用更新仓库：$AGENT_BASE"
fi
prepare_binary
'''
if old_prepare not in text:
    raise SystemExit("prepare flow marker not found")
text = text.replace(old_prepare, new_prepare, 1)

old_finish = '''chmod 0755 "$INSTALL_DIR/labprobe-install.sh"
say "安装完成"
"$BIN" status --config "$CONFIG"
say "诊断：labrelay doctor / status / test-hub"
command_ack "completed" "Agent 已升级并通过 Relay 与 Hub 校验"
'''
new_finish = '''chmod 0755 "$INSTALL_DIR/labprobe-install.sh"
if [ "$ACTION" = "upgrade" ]; then
  say "升级完成"
else
  say "安装完成"
fi
"$BIN" status --config "$CONFIG"
say "诊断：labrelay doctor / status / test-hub"
command_ack "completed" "Agent 已升级并通过 Relay 与 Hub 校验"
'''
if old_finish not in text:
    raise SystemExit("finish marker not found")
text = text.replace(old_finish, new_finish, 1)

path.write_text(text, encoding="utf-8")
