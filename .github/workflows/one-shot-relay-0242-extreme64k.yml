name: One-shot Relay 0.2.42 extreme 64k test

on:
  push:
    branches:
      - fix/hub-push-installer-upgrade
    paths:
      - .github/workflows/one-shot-relay-0242-extreme64k.yml

permissions:
  contents: write

jobs:
  patch-test-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/hub-push-installer-upgrade
          fetch-depth: 0

      - name: Apply Relay 0.2.42 extreme-mode patch
        run: python3 scripts/one_shot_relay_0242_extreme64k.py

      - name: Format and test Relay
        run: |
          set -euo pipefail
          cargo fmt --manifest-path labrelay/Cargo.toml
          cargo test --manifest-path labrelay/Cargo.toml --all-targets
          cargo check --manifest-path labrelay/Cargo.toml --all-targets
          grep -q 'version = "0.2.42"' labrelay/Cargo.toml
          python3 - <<'PY'
          import re
          from pathlib import Path
          lock = Path('labrelay/Cargo.lock').read_text(encoding='utf-8')
          match = re.search(r'\[\[package\]\]\nname = "labrelay"\nversion = "([^"]+)"', lock)
          if not match or match.group(1) != '0.2.42':
              raise SystemExit(f'Cargo.lock not aligned: {match.group(1) if match else "missing"}')
          PY

      - name: Commit Relay 0.2.42 benchmark fix
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add labrelay/Cargo.toml labrelay/Cargo.lock labrelay/src/tcp_session_test.rs
          git diff --cached --check
          git commit -m 'fix(relay): drive extreme TCP peak toward 64k'
          git push origin HEAD:fix/hub-push-installer-upgrade

      - name: Publish test-bundle tag
        run: |
          set -euo pipefail
          TAG='test-bundle/20260903-relay-0242-extreme64k'
          git tag "$TAG"
          git push origin "refs/tags/$TAG"
