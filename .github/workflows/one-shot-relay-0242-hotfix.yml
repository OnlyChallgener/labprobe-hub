name: One-shot installer rollback legacy fix

on:
  push:
    branches:
      - fix/relay-nofile-upgrade-0.2.33-v2
    paths:
      - .github/workflows/one-shot-relay-0242-hotfix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/relay-nofile-upgrade-0.2.33-v2
          fetch-depth: 0

      - name: Apply rollback fix
        run: python3 scripts/one_shot_installer_rollback_legacy_fix.py

      - name: Verify installer
        run: |
          sh -n scripts/labprobe-install.sh
          grep -q 'Never resurrect legacy' scripts/labprobe-install.sh
          grep -q 'HAD_OLD_INIT' scripts/labprobe-install.sh
          grep -q 'LOCAL_BINARY="${LABRELAY_BINARY:-}"' scripts/labprobe-install.sh

      - name: Commit rollback fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/labprobe-install.sh
          git diff --cached --check
          git commit -m 'fix(installer): do not resurrect legacy split services on rollback'
          git push origin HEAD:fix/relay-nofile-upgrade-0.2.33-v2
