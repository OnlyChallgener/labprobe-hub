name: One-shot publish Relay 0.2.42 extreme64k test

on:
  push:
    branches:
      - fix/hub-push-installer-upgrade
    paths:
      - .github/workflows/one-shot-relay-0242-publish-test.yml

permissions:
  contents: write

jobs:
  publish-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/hub-push-installer-upgrade
          fetch-depth: 0

      - name: Verify Relay source
        run: |
          set -euo pipefail
          grep -q 'version = "0.2.42"' labrelay/Cargo.toml
          cargo test --manifest-path labrelay/Cargo.toml --all-targets

      - name: Install cross and QEMU
        run: |
          cargo install cross --locked
          sudo apt-get update
          sudo apt-get install -y qemu-user-static

      - name: Build static ARM64 test binary
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/labrelay-cross-target
        run: cross build --manifest-path labrelay/Cargo.toml --release --target aarch64-unknown-linux-musl

      - name: Verify and assemble test bundle
        env:
          VERSION: '0.2.42'
          RELEASE_TAG: 'test-bundle/20260903-relay-0242-extreme64k'
          CARGO_TARGET_DIR: ${{ runner.temp }}/labrelay-cross-target
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/agent"
          BINARY="$CARGO_TARGET_DIR/aarch64-unknown-linux-musl/release/labrelay"
          test -x "$BINARY"
          OUTPUT="$(qemu-aarch64-static "$BINARY" version)"
          printf '%s\n' "$OUTPUT"
          test "$OUTPUT" = "labrelay $VERSION"
          mkdir -p "$OUT"
          cp "$BINARY" "$OUT/labrelay-linux-arm64"
          cp scripts/labprobe-install.sh "$OUT/install.sh"
          chmod 755 "$OUT/labrelay-linux-arm64" "$OUT/install.sh"
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          out = Path(os.environ['RUNNER_TEMP']) / 'agent'
          version = os.environ['VERSION']
          tag = os.environ['RELEASE_TAG']
          root = f'https://github.com/OnlyChallgener/labprobe-hub/releases/download/{tag}'

          def meta(name: str):
              data = (out / name).read_bytes()
              return {
                  'url': f'{root}/{name}',
                  'sha256': hashlib.sha256(data).hexdigest(),
                  'sizeBytes': len(data),
              }

          manifest = {
              'schemaVersion': 1,
              'versionName': version,
              'changelog': 'TEST: TCP peak extreme mode targets 64,000 held connections, temporarily raises Conntrack max to 131072, removes 80/95% load throttling, uses small socket buffers, detaches held sockets from Tokio, and restores temporary sysctls after the test.',
              'installUrl': f'{root}/install.sh',
              'checksumsUrl': f'{root}/checksums.txt',
              'installer': meta('install.sh'),
              'binaries': {'arm64': meta('labrelay-linux-arm64')},
          }
          (out / 'latest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          names = ['labrelay-linux-arm64', 'install.sh', 'latest.json']
          lines = []
          for name in names:
              data = (out / name).read_bytes()
              lines.append(f'{hashlib.sha256(data).hexdigest()}  {name}')
          (out / 'checksums.txt').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          (cd "$OUT" && sha256sum -c checksums.txt)
          tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/labrelay-test-arm64-v$VERSION.tar.gz" agent

      - name: Upload test artifact
        uses: actions/upload-artifact@v4
        with:
          name: labrelay-test-arm64-v0.2.42-extreme64k
          path: |
            ${{ runner.temp }}/agent/**
            ${{ runner.temp }}/labrelay-test-arm64-v0.2.42.tar.gz
          if-no-files-found: error
          retention-days: 14

      - name: Publish test prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-bundle/20260903-relay-0242-extreme64k
          target_commitish: fix/hub-push-installer-upgrade
          name: LabRelay 0.2.42 extreme64k test
          prerelease: true
          make_latest: false
          generate_release_notes: false
          body: |
            LabRelay 0.2.42 test build for BE72 TCP peak extreme mode.

            Main changes:
            - target up to 64,000 held TCP connections in extreme mode;
            - temporarily set `ip_local_port_range=1024 65535`;
            - temporarily raise `nf_conntrack_max` to 131072 when required;
            - remove 80% / 95% connection-count based CPS throttling in extreme mode;
            - do not use the static memory estimate as an extreme-mode target cap;
            - keep a 96 MB real MemAvailable floor;
            - use 4 KiB socket buffers and detach established hold sockets from Tokio;
            - skip repeated `/proc/net/tcp*` full scans while the extreme test is running;
            - restore temporary source-port and Conntrack settings after completion/stop/error.

            Test build only. Production LabRelay release is unchanged.
          files: |
            ${{ runner.temp }}/agent/labrelay-linux-arm64
            ${{ runner.temp }}/agent/install.sh
            ${{ runner.temp }}/agent/latest.json
            ${{ runner.temp }}/agent/checksums.txt
            ${{ runner.temp }}/labrelay-test-arm64-v0.2.42.tar.gz
