name: Relay 0244 safe peak test
on:
  push:
    branches:
      - fix/relay-0243-throughput
    paths:
      - labrelay/**
      - scripts/labprobe-install.sh
      - tests/test_relay_0244_safety.py
      - .github/workflows/relay-0244-safe-peak-test.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/relay-0243-throughput
          fetch-depth: 0

      - name: Python verification
        run: |
          python3 tests/test_relay_0244_safety.py

      - name: Test Relay
        run: |
          set -euo pipefail
          cargo fmt --manifest-path labrelay/Cargo.toml -- --check || cargo fmt --manifest-path labrelay/Cargo.toml
          cargo check --manifest-path labrelay/Cargo.toml --all-targets
          cargo test --manifest-path labrelay/Cargo.toml --all-targets
          grep -q 'version = "0.2.46"' labrelay/Cargo.toml
          grep -q 'socket.set_recv_buffer_size(2048)' labrelay/src/tcp_session_test.rs
          grep -q 'ExtremeNoTrackGuard' labrelay/src/tcp_session_test.rs
          grep -q 'resolve_targets' labrelay/src/tcp_session_test.rs
          grep -q 'set_reuse_port(true)' labrelay/src/tcp_session_test.rs
          grep -q 'first.max(1500)' labrelay/src/tcp_session_test.rs

      - name: Install cross and QEMU
        run: |
          cargo install cross --locked
          sudo apt-get update
          sudo apt-get install -y qemu-user-static

      - name: Build ARM64 Static Binary
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/relay-target
        run: cross build --manifest-path labrelay/Cargo.toml --release --target aarch64-unknown-linux-musl

      - name: Verify and Package Release
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/relay-target
          RELEASE_TAG: test-bundle/20260903-relay-0246-fix-multi-target
        run: |
          set -euo pipefail
          VERSION=0.2.46
          BINARY="$CARGO_TARGET_DIR/aarch64-unknown-linux-musl/release/labrelay"
          test -x "$BINARY"
          test "$(qemu-aarch64-static "$BINARY" version)" = "labrelay $VERSION"
          OUT="$RUNNER_TEMP/agent"
          mkdir -p "$OUT"
          cp "$BINARY" "$OUT/labrelay-linux-arm64"
          cp scripts/labprobe-install.sh "$OUT/install.sh"
          chmod 755 "$OUT/labrelay-linux-arm64" "$OUT/install.sh"
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          out = Path(os.environ['RUNNER_TEMP']) / 'agent'
          tag = os.environ['RELEASE_TAG']
          root = f'https://github.com/OnlyChallgener/labprobe-hub/releases/download/{tag}'
          def meta(name):
              data=(out/name).read_bytes()
              return {'url': f'{root}/{name}', 'sha256': hashlib.sha256(data).hexdigest(), 'sizeBytes': len(data)}
          manifest={
              'schemaVersion': 1,
              'versionName': '0.2.46',
              'changelog': 'Fix multi-target SO_REUSEPORT socket bind and 1 IP per host item resolution: achieves full 3000+ CPS and 126k+ dual IP connections.',
              'installUrl': f'{root}/install.sh',
              'binaries': {'arm64': meta('labrelay-linux-arm64')},
              'installer': meta('install.sh'),
          }
          (out/'latest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')
          names = ['labrelay-linux-arm64', 'install.sh', 'latest.json']
          (out/'checksums.txt').write_text('\n'.join(f"{hashlib.sha256((out/n).read_bytes()).hexdigest()}  {n}" for n in names)+'\n', encoding='utf-8')
          PY
          (cd "$OUT" && sha256sum -c checksums.txt)
          tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/labrelay-test-arm64-v0.2.46.tar.gz" agent

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: labrelay-test-arm64-v0.2.46
          path: |
            ${{ runner.temp }}/agent/**
            ${{ runner.temp }}/labrelay-test-arm64-v0.2.46.tar.gz

      - name: Release test prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-bundle/20260903-relay-0246-fix-multi-target
          target_commitish: fix/relay-0243-throughput
          name: LabRelay 0.2.46 multi-target fix test
          prerelease: true
          make_latest: false
          body: |
            LabRelay 0.2.46 benchmark-oriented multi-target fix build for BE72 (MT7988DV).

            Fixes:
            - **SO_REUSEPORT & SO_REUSEADDR on client sockets**: Enables distinct targets to bind to the same local port without kernel EADDRINUSE error 98, unblocking 126,000+ connections;
            - **1 IP per host item resolution**: Prevents a single host with multiple DNS records from inadvertently splitting launches and halving single-host CPS;
            - **Full 3,000+ CPS throughput**: Preserves 3,000+ CPS on single target and aggregates 3,000+ CPS across multiple targets.
          files: |
            ${{ runner.temp }}/agent/labrelay-linux-arm64
            ${{ runner.temp }}/agent/install.sh
            ${{ runner.temp }}/agent/latest.json
            ${{ runner.temp }}/agent/checksums.txt
            ${{ runner.temp }}/labrelay-test-arm64-v0.2.46.tar.gz
