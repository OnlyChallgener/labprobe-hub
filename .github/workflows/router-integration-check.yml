name: Router Integration Check

on:
  push:
    branches:
      - hub0919
      - hub0922
      - hub0923
      - hub0924
      - codex/router-rpc-v098-relay-v029
    paths:
      - Dockerfile
      - router_*.py
      - followup_stability_patch.py
      - final_stability_patch.py
      - agent_presence_patch.py
      - device_history_patch.py
      - portmap_persistence_patch.py
      - hub.py
      - hub_entry.py
      - hub_realtime_ws.py
      - labprobe_storage.py
      - requirements.txt
      - pytest.ini
      - tests/**
      - labrelay/**
      - .github/workflows/router-integration-check.yml
  pull_request:
    paths:
      - Dockerfile
      - router_*.py
      - followup_stability_patch.py
      - final_stability_patch.py
      - agent_presence_patch.py
      - device_history_patch.py
      - portmap_persistence_patch.py
      - hub.py
      - hub_entry.py
      - hub_realtime_ws.py
      - labprobe_storage.py
      - requirements.txt
      - pytest.ini
      - tests/**
      - labrelay/**
      - .github/workflows/router-integration-check.yml
  workflow_dispatch:

concurrency:
  group: hub-router-integration-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  statuses: write

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
      APP_TOKEN: ci-app-token
      HOOK_TOKEN: ci-hook-token
    steps:
      - uses: actions/checkout@v4
      - name: Publish Hub CI start
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: 'labprobe/hub-integration-stage',
              description: 'Hub 0.9.32 validation started',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        id: install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Compile Hub Python modules
        id: compile
        run: |
          python -m py_compile \
            hub.py hub_entry.py hub_realtime_ws.py labprobe_storage.py followup_stability_patch.py final_stability_patch.py \
            agent_presence_patch.py device_history_patch.py portmap_persistence_patch.py \
            router_rpc.py router_rpc_v099.py router_rpc_v010.py \
            router_developer_flow_patch.py router_http_developer_transport_patch.py \
            router_be72_auth_patch.py router_be72_sid_wire_patch.py \
            router_native_features_patch.py router_ws_patch.py router_fast_watchdog_patch.py \
            router_build024_fix.py router_compat.py router_realtime_stability_patch.py \
            router_relay_credentials_patch.py router_lite_realtime_patch.py \
            router_slow_cache_patch.py router_control_scheduler_patch.py \
            router_control_actor_patch.py router_task_manager_patch.py \
            router_config_sync_patch.py router_device_live_sync_patch.py
      - name: Run Hub pytest suite
        id: pytest
        shell: bash
        run: |
          set +e
          python -m pytest -q > /tmp/hub-pytest.log 2>&1
          STATUS=$?
          cat /tmp/hub-pytest.log
          if [ "$STATUS" -ne 0 ]; then
            tail -n 18 /tmp/hub-pytest.log | tr '\n' ' ' | cut -c1-500 > /tmp/hub-ci-error.txt
          fi
          exit $STATUS
      - name: Verify Hub 0.9.32 active invariants
        id: invariants
        run: |
          set -e
          grep -q 'HUB_VERSION = "0.9.32"' hub_entry.py
          grep -q 'install_final_stability_patch(hub)' hub_entry.py
          grep -q 'TERMINAL_TASK_STATES' final_stability_patch.py
          grep -q '/api/agent/update/check' final_stability_patch.py
          grep -q 'protocol": "HTTPS"' final_stability_patch.py
          grep -q '网关 502' final_stability_patch.py
          grep -q 'COPY final_stability_patch.py' Dockerfile
          grep -q 'install_followup_stability_patch(hub, router_lite_realtime)' hub_entry.py
          grep -q 'continuous two-second terminal rate cache enabled' followup_stability_patch.py
          grep -q 'install_router_device_live_sync_patch(hub, hub.ROUTER_TASK_MANAGER.client)' hub_entry.py
          grep -q 'POLL_INTERVAL_SECONDS.*ROUTER_DEVICE_LIVE_POLL_SEC.*, "5"' router_device_live_sync_patch.py
          grep -q 'PERSIST_INTERVAL_SECONDS' router_device_live_sync_patch.py
          grep -q '"devices_snapshot"' router_device_live_sync_patch.py
          grep -q '"devType": "all", "dataType": "timely"' router_device_live_sync_patch.py
          grep -q 'confirmedEmpty' router_device_live_sync_patch.py
          grep -q 'BACKGROUND_DEFERRED' router_device_live_sync_patch.py
          grep -q '/api/router/devices/live/status' router_device_live_sync_patch.py
          grep -q '/api/realtime/ws' hub_realtime_ws.py
          grep -q 'PROTOCOL_NAME = "labprobe-realtime-v3"' hub_realtime_ws.py
          grep -q 'install_device_history_patch(hub)' hub_entry.py
          grep -q 'install_portmap_persistence_patch(hub)' hub_entry.py
          grep -q 'install_router_task_manager_patch(hub)' hub_entry.py
          grep -q 'thread_name.startswith("router-task-")' router_control_actor_patch.py
          ! grep -q 'requests.Session' router_lite_realtime_patch.py
          python - <<'PY'
          import threading
          import time
          from types import SimpleNamespace
          from final_stability_patch import _freeze_router_task_timing, _friendly_update_error

          class Logger:
              def info(self, *args, **kwargs): pass
          class Manager:
              def __init__(self):
                  now = int(time.time())
                  self.lock = threading.RLock()
                  self.tasks = {
                      'nat': {
                          'kind': 'nat', 'state': 'succeeded', 'startedAt': now - 100,
                          'updatedAt': now - 80, 'elapsedSeconds': 0, 'log': [], 'result': {}
                      }
                  }
              def _save(self): pass
              def _publish(self, kind): pass
          manager = Manager()
          fake = SimpleNamespace(ROUTER_TASK_MANAGER=manager, LOGGER=Logger())
          _freeze_router_task_timing(fake)
          first = manager._snapshot_locked('nat')['elapsedSeconds']
          time.sleep(1.05)
          second = manager._snapshot_locked('nat')['elapsedSeconds']
          assert first == 20, first
          assert second == first, (first, second)
          friendly = _friendly_update_error('HTTP 502: <!DOCTYPE html>')
          assert '<!DOCTYPE' not in friendly
          assert '502' in friendly
          print('Hub terminal task timing and Agent error normalization verified')
          PY
      - name: Build and inspect runtime Docker image
        id: docker
        run: |
          set -e
          docker build --tag labprobe-hub-ci:latest .
          for file in followup_stability_patch.py final_stability_patch.py router_device_live_sync_patch.py router_lite_realtime_patch.py hub_realtime_ws.py router_fast_watchdog_patch.py router_build024_fix.py router_task_manager_patch.py agent_presence_patch.py device_history_patch.py portmap_persistence_patch.py; do
            docker run --rm --entrypoint sh labprobe-hub-ci:latest -c "test -f /app/$file"
          done
          docker run --rm --entrypoint python labprobe-hub-ci:latest -c 'import followup_stability_patch, final_stability_patch, router_device_live_sync_patch, agent_presence_patch, device_history_patch, portmap_persistence_patch, router_lite_realtime_patch, router_fast_watchdog_patch, router_build024_fix, router_native_features_patch, router_control_actor_patch, router_task_manager_patch, hub_realtime_ws; print("Hub 0.9.32 timing, Agent check, terminal, history, mapping and task imports ok")'
      - name: Compile and test active LabRelay agent
        id: relay
        working-directory: labrelay
        run: |
          cargo test --all-targets
          cargo build --release
          grep -q 'fn collect_user_list()' src/agent.rs
          grep -q '"user_list"' src/agent.rs
          grep -q '"dataType":"timely"' src/agent.rs
          grep -q '/hook/ruijie/devices' src/agent.rs
          grep -q 'version = "0.2.12"' Cargo.toml
      - name: Publish connector-readable Hub CI result
        if: always()
        uses: actions/github-script@v7
        env:
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          COMPILE_OUTCOME: ${{ steps.compile.outcome }}
          PYTEST_OUTCOME: ${{ steps.pytest.outcome }}
          INVARIANTS_OUTCOME: ${{ steps.invariants.outcome }}
          DOCKER_OUTCOME: ${{ steps.docker.outcome }}
          RELAY_OUTCOME: ${{ steps.relay.outcome }}
        with:
          script: |
            const fs = require('fs');
            const outcomes = {
              install: process.env.INSTALL_OUTCOME,
              compile: process.env.COMPILE_OUTCOME,
              pytest: process.env.PYTEST_OUTCOME,
              invariants: process.env.INVARIANTS_OUTCOME,
              docker: process.env.DOCKER_OUTCOME,
              relay: process.env.RELAY_OUTCOME,
            };
            const ok = Object.values(outcomes).every(value => value === 'success');
            let detail = Object.entries(outcomes).map(([key, value]) => `${key}=${value}`).join(' ');
            if (fs.existsSync('/tmp/hub-ci-error.txt')) {
              detail = fs.readFileSync('/tmp/hub-ci-error.txt', 'utf8').trim() || detail;
            }
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: ok ? 'success' : 'failure',
              context: 'labprobe/hub-integration-stage',
              description: detail.slice(0, 140),
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
      - name: Upload Hub pytest diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hub-pytest-diagnostic
          path: |
            /tmp/hub-pytest.log
            /tmp/hub-ci-error.txt
          if-no-files-found: ignore
