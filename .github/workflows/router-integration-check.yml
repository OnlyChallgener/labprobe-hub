name: Router Integration Check

on:
  push:
    branches:
      - hub0919
      - hub0922
      - hub0923
      - codex/router-rpc-v098-relay-v029
    paths:
      - Dockerfile
      - router_*.py
      - agent_presence_patch.py
      - device_history_patch.py
      - portmap_persistence_patch.py
      - hub.py
      - hub_entry.py
      - hub_realtime_ws.py
      - labprobe_storage.py
      - requirements.txt
      - pytest.ini
      - tests/**
      - labrelay/**
      - .github/workflows/router-integration-check.yml
  pull_request:
    paths:
      - Dockerfile
      - router_*.py
      - agent_presence_patch.py
      - device_history_patch.py
      - portmap_persistence_patch.py
      - hub.py
      - hub_entry.py
      - hub_realtime_ws.py
      - labprobe_storage.py
      - requirements.txt
      - pytest.ini
      - tests/**
      - labrelay/**
      - .github/workflows/router-integration-check.yml
  workflow_dispatch:

concurrency:
  group: hub-router-integration-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  statuses: write

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - name: Publish Hub CI start
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: 'labprobe/hub-integration-stage',
              description: 'Hub 0.9.29 validation started',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        id: install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Compile Hub Python modules
        id: compile
        working-directory: ${{ github.workspace }}
        run: |
          python -m py_compile hub.py hub_entry.py hub_realtime_ws.py agent_presence_patch.py device_history_patch.py portmap_persistence_patch.py labprobe_storage.py router_rpc.py router_rpc_v099.py router_rpc_v010.py router_developer_flow_patch.py router_http_developer_transport_patch.py router_be72_auth_patch.py router_be72_sid_wire_patch.py router_native_features_patch.py router_ws_patch.py router_fast_watchdog_patch.py router_build024_fix.py router_compat.py router_realtime_stability_patch.py router_relay_credentials_patch.py router_lite_realtime_patch.py router_slow_cache_patch.py router_control_scheduler_patch.py router_control_actor_patch.py router_task_manager_patch.py router_config_sync_patch.py
      - name: Run Hub pytest suite
        id: pytest
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          set +e
          python -m pytest -q > /tmp/hub-pytest.log 2>&1
          STATUS=$?
          cat /tmp/hub-pytest.log
          if [ "$STATUS" -ne 0 ]; then
            tail -n 18 /tmp/hub-pytest.log | tr '\n' ' ' | cut -c1-500 > /tmp/hub-ci-error.txt
          fi
          exit $STATUS
      - name: Verify Hub 0.9.29 source invariants
        id: invariants
        working-directory: ${{ github.workspace }}
        run: |
          set -e
          grep -q 'HUB_VERSION = "0.9.29"' hub_entry.py
          grep -q 'install_router_build024_fix()' hub_entry.py
          grep -q 'install_router_control_actor_patch()' hub_entry.py
          grep -q 'install_router_task_manager_patch(hub)' hub_entry.py
          grep -q 'install_agent_presence_patch(hub)' hub_entry.py
          grep -q 'install_device_history_patch(hub)' hub_entry.py
          grep -q 'install_portmap_persistence_patch(hub)' hub_entry.py
          grep -q 'FAST_STALL_SECONDS = 8.0' router_fast_watchdog_patch.py
          grep -q 'MAX_ROUTER_RETRY_SECONDS = 2.0' router_fast_watchdog_patch.py
          grep -q 'ROUTER_STALE_MS = 12_000' router_fast_watchdog_patch.py
          grep -q 'DETAIL_REFRESH_SECONDS = 60.0' router_build024_fix.py
          grep -q '_router_fields_precise' router_build024_fix.py
          grep -q '"temperature2gC"' router_build024_fix.py
          grep -q '"temperature5gC"' router_build024_fix.py
          grep -q '"storagePercent"' router_build024_fix.py
          grep -q 'router-details-refresh' router_build024_fix.py
          grep -q 'monitor_class._loop = _router_ws_loop_fast_recovery' router_fast_watchdog_patch.py
          grep -q 'router fast stream stalled; reconnecting' router_fast_watchdog_patch.py
          grep -q '/api/realtime/ws' hub_realtime_ws.py
          grep -q 'PROTOCOL_NAME = "labprobe-realtime-v3"' hub_realtime_ws.py
          grep -q '_send_initial_snapshots' hub_realtime_ws.py
          grep -q '_wake_device_sampler' hub_realtime_ws.py
          grep -q 'terminalSamplerWake' hub_realtime_ws.py
          grep -q 'KEEPALIVE_SECONDS = 3.0' hub_realtime_ws.py
          grep -q 'router_eweb_ws_fast' router_lite_realtime_patch.py
          grep -q 'acceptedRouter' router_lite_realtime_patch.py
          grep -q 'acceptedDevices' router_lite_realtime_patch.py
          grep -q '@bp.post("/tasks/<kind>")' router_task_manager_patch.py
          grep -q 'state="timed_out"' router_task_manager_patch.py
          grep -q '暂无可用的新版本' router_task_manager_patch.py
          grep -q 'thread_name.startswith("router-task-")' router_control_actor_patch.py
          grep -q 'ONLINE_SECONDS.*90' agent_presence_patch.py
          grep -q 'publish("agent", snapshot)' agent_presence_patch.py
          grep -q '/api/router/devices/snapshot' device_history_patch.py
          grep -q 'EMPTY_CONFIRMATIONS = 2' device_history_patch.py
          grep -q 'hasDurableDeviceSnapshot' device_history_patch.py
          grep -q 'rulesRevision' portmap_persistence_patch.py
          grep -q 'rulesLoaded' portmap_persistence_patch.py
          grep -q 'DEFAULT_STUN_HOST = "stun.voip.aebc.com"' router_native_features_patch.py
          ! grep -q 'requests.Session' router_lite_realtime_patch.py
          ! grep -q 'ws_sysinfo' router_lite_realtime_patch.py
          ! grep -q 'user_list' router_lite_realtime_patch.py
          ! grep -q 'sync_devices' router_lite_realtime_patch.py
          ! grep -q 'MQTT_PUBLISHER' router_lite_realtime_patch.py
      - name: Build and inspect runtime Docker image
        id: docker
        working-directory: ${{ github.workspace }}
        run: |
          set -e
          docker build --tag labprobe-hub-ci:latest .
          for file in router_lite_realtime_patch.py hub_realtime_ws.py router_fast_watchdog_patch.py router_build024_fix.py router_task_manager_patch.py agent_presence_patch.py device_history_patch.py portmap_persistence_patch.py; do
            docker run --rm --entrypoint sh labprobe-hub-ci:latest -c "test -f /app/$file"
          done
          docker run --rm --entrypoint python labprobe-hub-ci:latest -c 'import agent_presence_patch, device_history_patch, portmap_persistence_patch, router_lite_realtime_patch, router_fast_watchdog_patch, router_build024_fix, router_native_features_patch, router_control_actor_patch, router_task_manager_patch, hub_realtime_ws; print("Hub realtime, history, mapping, task and presence imports ok")'
      - name: Compile and test LabRelay realtime and durable snapshot agent
        id: relay
        working-directory: ${{ github.workspace }}/labrelay
        run: |
          cargo test --all-targets
          cargo build --release
          grep -q 'DEVICES_SAMPLE_INTERVAL: Duration = Duration::from_secs(2)' src/runtime.rs
          grep -q 'DURABLE_SNAPSHOT_INTERVAL: Duration = Duration::from_secs(60)' src/runtime.rs
          grep -q 'async fn devices_lane(' src/runtime.rs
          grep -q 'async fn durable_snapshot_lane(' src/runtime.rs
          grep -q 'MissedTickBehavior::Skip' src/runtime.rs
          grep -q '/api/router/realtime/agent/demand' src/runtime.rs
          grep -q '/api/router/realtime/agent/push' src/runtime.rs
          grep -q '/api/router/devices/snapshot' src/runtime.rs
          grep -q '"user_list"' src/runtime.rs
          ! grep -q 'ws_sysinfo' src/runtime.rs
          ! grep -q 'routerSample' src/runtime.rs
          grep -q 'relay_local_dev_sta' src/runtime.rs
          grep -q 'version = "0.2.12"' Cargo.toml
      - name: Publish connector-readable Hub CI result
        if: always()
        uses: actions/github-script@v7
        env:
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          COMPILE_OUTCOME: ${{ steps.compile.outcome }}
          PYTEST_OUTCOME: ${{ steps.pytest.outcome }}
          INVARIANTS_OUTCOME: ${{ steps.invariants.outcome }}
          DOCKER_OUTCOME: ${{ steps.docker.outcome }}
          RELAY_OUTCOME: ${{ steps.relay.outcome }}
        with:
          script: |
            const fs = require('fs');
            const outcomes = {
              install: process.env.INSTALL_OUTCOME,
              compile: process.env.COMPILE_OUTCOME,
              pytest: process.env.PYTEST_OUTCOME,
              invariants: process.env.INVARIANTS_OUTCOME,
              docker: process.env.DOCKER_OUTCOME,
              relay: process.env.RELAY_OUTCOME,
            };
            const ok = Object.values(outcomes).every(value => value === 'success');
            let detail = Object.entries(outcomes).map(([key, value]) => `${key}=${value}`).join(' ');
            if (fs.existsSync('/tmp/hub-ci-error.txt')) {
              detail = fs.readFileSync('/tmp/hub-ci-error.txt', 'utf8').trim() || detail;
            }
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: ok ? 'success' : 'failure',
              context: 'labprobe/hub-integration-stage',
              description: detail.slice(0, 140),
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
      - name: Upload Hub pytest diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hub-pytest-diagnostic
          path: |
            /tmp/hub-pytest.log
            /tmp/hub-ci-error.txt
          if-no-files-found: ignore
