name: Test Bundle Release

# Shared test-release tag across labprobe-hub and LabProbeApp.
# Pushing the same `test-bundle/*` tag to both repos builds the full trio
# (Hub image, LabRelay router bundle, APP APK) as prereleases without
# touching production channels (latest image tag, v*/v*-build* releases).

on:
  push:
    tags:
      - 'test-bundle/*'
  workflow_dispatch:

concurrency:
  group: test-bundle-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  hub-docker:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test Hub runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
          python -m pytest -q

      - name: Resolve test image tag
        shell: bash
        run: |
          set -euo pipefail
          # Docker tags cannot contain '/'; derive test-<id> from the ref.
          TEST_ID="${GITHUB_REF_NAME#test-bundle/}"
          TEST_ID="${TEST_ID//\//-}"
          if [ -z "$TEST_ID" ]; then
            TEST_ID="run-${GITHUB_RUN_ID}"
          fi
          echo "TEST_IMAGE_TAG=test-${TEST_ID}" >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push test Hub image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/labprobe-hub:${{ env.TEST_IMAGE_TAG }}

  labrelay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read LabRelay version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^version = "\([^"]*\)"/\1/p' labrelay/Cargo.toml | head -n 1)"
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Test LabRelay
        run: cargo test --manifest-path labrelay/Cargo.toml --all-targets

      - name: Install cross and QEMU
        run: |
          cargo install cross --locked
          sudo apt-get update
          sudo apt-get install -y qemu-user-static

      - name: Build static ARM64 router binary
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/labrelay-cross-target
        run: cross build --manifest-path labrelay/Cargo.toml --release --target aarch64-unknown-linux-musl

      - name: Verify binary self-reported version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          BINARY="$RUNNER_TEMP/labrelay-cross-target/aarch64-unknown-linux-musl/release/labrelay"
          test -x "$BINARY"
          OUTPUT="$(qemu-aarch64-static "$BINARY" version)"
          printf '%s\n' "$OUTPUT"
          test "$OUTPUT" = "labrelay $VERSION"

      - name: Assemble test agent bundle
        env:
          VERSION: ${{ steps.version.outputs.version }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/agent"
          BINARY="$RUNNER_TEMP/labrelay-cross-target/aarch64-unknown-linux-musl/release/labrelay"
          test -x "$BINARY"
          mkdir -p "$OUT"
          cp "$BINARY" "$OUT/labrelay-linux-arm64"
          cp agent/install.sh "$OUT/install.sh"
          chmod 755 "$OUT/labrelay-linux-arm64" "$OUT/install.sh"
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          out = Path(os.environ['RUNNER_TEMP']) / 'agent'
          version = os.environ['VERSION']
          release_tag = os.environ['RELEASE_TAG']
          release_root = f'https://github.com/OnlyChallgener/labprobe-hub/releases/download/{release_tag}'
          public_root = 'https://lab.net86.dynv6.net:27772/agent'

          def metadata(name: str):
              data = (out / name).read_bytes()
              return {
                  'url': f'{release_root}/{name}',
                  'fallbackUrl': f'{public_root}/{name}',
                  'sha256': hashlib.sha256(data).hexdigest(),
                  'sizeBytes': len(data),
              }

          manifest = {
              'schemaVersion': 1,
              'versionName': version,
              'changelog': f'Test bundle build for {release_tag}.',
              'installUrl': f'{release_root}/install.sh',
              'checksumsUrl': f'{release_root}/checksums.txt',
              'installer': metadata('install.sh'),
              'binaries': {'arm64': metadata('labrelay-linux-arm64')},
          }
          (out / 'latest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          names = ['labrelay-linux-arm64', 'install.sh', 'latest.json']
          lines = []
          for name in names:
              data = (out / name).read_bytes()
              lines.append(f'{hashlib.sha256(data).hexdigest()}  {name}')
          (out / 'checksums.txt').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          (cd "$OUT" && sha256sum -c checksums.txt)
          tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/labrelay-test-arm64-v$VERSION.tar.gz" agent

      - name: Upload router bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: labrelay-test-arm64-v${{ steps.version.outputs.version }}
          path: |
            ${{ runner.temp }}/agent/**
            ${{ runner.temp }}/labrelay-test-arm64-v${{ steps.version.outputs.version }}.tar.gz
          if-no-files-found: error

      - name: Publish test prerelease
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Test bundle ${{ github.ref_name }}
          prerelease: true
          make_latest: false
          generate_release_notes: false
          body: |
            Test bundle build. Not for production use.

            Router install:
            `sh install.sh HUB_URL HOOK_TOKEN ROUTER_NAME`
          files: |
            ${{ runner.temp }}/agent/labrelay-linux-arm64
            ${{ runner.temp }}/agent/install.sh
            ${{ runner.temp }}/agent/latest.json
            ${{ runner.temp }}/agent/checksums.txt
            ${{ runner.temp }}/labrelay-test-arm64-v${{ steps.version.outputs.version }}.tar.gz
