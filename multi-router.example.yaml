version: 1
gateway:
  listenPort: 58443
  registryPort: 58444
  publicBaseUrl: http://192.168.5.46:58443
  storageRoot: /app/multi
  defaultRouterId: home-reyee
routers:
  - routerId: home-reyee
    name: 家庭锐捷
    site: 家
    model: Reyee
    platform: reyee
    ewebTransport: direct
    ewebUrl: http://192.168.5.1
    workerPort: 58501
    appTokenEnv: HOME_APP_TOKEN
    hookTokenEnv: HOME_HOOK_TOKEN
  - routerId: be50
    name: BE50
    site: 节点小宝组网
    model: BE50
    platform: reyee
    ewebTransport: direct
    ewebUrl: http://100.66.1.1
    workerPort: 58502
    appTokenEnv: BE50_APP_TOKEN
    hookTokenEnv: BE50_HOOK_TOKEN
